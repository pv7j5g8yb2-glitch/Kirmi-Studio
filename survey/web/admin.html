<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Survey admin</title>
<style>
  :root {
    color-scheme: light;
    --ink: #1a1a1a;
    --ink-soft: #52535a;
    --glass-bg: rgba(255, 255, 255, 0.72);
    --glass-border: rgba(255, 255, 255, 0.55);
    --glass-edge: rgba(255, 255, 255, 0.95);
    --radius-lg: 22px;
    --radius-md: 14px;
    --radius-sm: 999px;
  }
  * { box-sizing: border-box; }
  body {
    font: 400 16px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    font-optical-sizing: auto;
    margin: 0;
    padding: 16px;
    color: var(--ink);
    min-height: 100vh;
    background:
      radial-gradient(1000px 600px at 8% -10%, rgba(255, 214, 196, 0.2), transparent 55%),
      radial-gradient(900px 700px at 108% 6%, rgba(196, 214, 255, 0.18), transparent 55%),
      radial-gradient(800px 600px at 50% 120%, rgba(205, 240, 222, 0.14), transparent 55%),
      #f5f4f1;
    background-attachment: fixed;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; gap: 8px; flex-wrap: wrap; }
  h1 { font-size: 19px; font-weight: 600; letter-spacing: -0.01em; margin: 0; }
  h2 { font-size: 15px; font-weight: 600; letter-spacing: -0.005em; margin: 0 0 10px; }
  .actions { display: flex; gap: 8px; }
  .actions a, .actions button { font-size: 13px; padding: 8px 14px; }

  button, .btn {
    background: linear-gradient(180deg, #2c2c2f, #141416);
    color: #fff;
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: var(--radius-md);
    padding: 10px 16px;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.005em;
    cursor: pointer;
    text-decoration: none;
    display: inline-block;
    box-shadow: 0 1px 2px rgba(0,0,0,0.12), 0 8px 18px -10px rgba(0,0,0,0.4);
    transition: transform 140ms cubic-bezier(.2,.8,.3,1), box-shadow 140ms ease, opacity 140ms ease;
  }
  button:active, .btn:active { transform: scale(0.96); box-shadow: 0 1px 1px rgba(0,0,0,0.12); }
  button:disabled { opacity: 0.5; cursor: default; transform: none; }

  /* Secondary / light glass buttons: top-bar utilities and the detail view's close button. */
  .actions a, .actions button, #close-detail {
    background: rgba(255, 255, 255, 0.78);
    color: var(--ink);
    border: 1px solid rgba(0, 0, 0, 0.08);
    box-shadow: none;
  }
  .actions a:active, .actions button:active, #close-detail:active { background: rgba(255, 255, 255, 0.95); }
  #close-detail { margin-bottom: 4px; }

  .panel {
    background: var(--glass-bg);
    backdrop-filter: blur(26px) saturate(180%);
    -webkit-backdrop-filter: blur(26px) saturate(180%);
    border-radius: var(--radius-lg);
    padding: 16px 18px;
    border: 1px solid var(--glass-border);
    border-top-color: var(--glass-edge);
    box-shadow: 0 16px 40px -20px rgba(20,20,30,0.24), 0 1px 6px rgba(20,20,30,0.05);
    margin-bottom: 14px;
  }
  #link-gen .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

  select, input[type="text"] {
    padding: 10px 12px;
    border: 1px solid rgba(0, 0, 0, 0.08);
    border-radius: var(--radius-md);
    font-size: 14px;
    background: rgba(255, 255, 255, 0.78);
    color: var(--ink);
    transition: box-shadow 180ms ease, border-color 180ms ease, background 180ms ease;
  }
  select:focus, input:focus {
    outline: none;
    background: rgba(255, 255, 255, 0.96);
    border-color: rgba(0, 0, 0, 0.16);
    box-shadow: 0 0 0 4px rgba(20, 20, 30, 0.08);
  }
  #link-gen input#ref-input { flex: 1; min-width: 160px; }
  #link-out {
    font-size: 13px;
    background: rgba(255, 255, 255, 0.78);
    border: 1px solid rgba(0, 0, 0, 0.08);
    border-radius: var(--radius-md);
    padding: 9px 12px;
    margin-top: 10px;
    word-break: break-all;
    display: none;
  }

  .chip {
    background: rgba(255, 255, 255, 0.78);
    color: var(--ink);
    border: 1px solid rgba(0, 0, 0, 0.08);
    border-radius: var(--radius-sm);
    padding: 6px 12px;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.01em;
    cursor: pointer;
    transition: transform 140ms cubic-bezier(.2,.8,.3,1), background 140ms ease;
  }
  .chip:hover { background: rgba(255, 255, 255, 0.95); }
  .chip:active { transform: scale(0.95); }
  .chip.active { background: linear-gradient(180deg, #2c2c2f, #141416); color: #fff; border-color: transparent; }

  #delete-response-btn {
    background: rgba(255, 232, 232, 0.85);
    color: #b00020;
    border: 1px solid rgba(176, 0, 32, 0.18);
    box-shadow: none;
    margin-left: 8px;
  }
  #delete-response-btn:active { background: rgba(255, 215, 215, 0.95); }

  .controls { display: flex; gap: 8px; flex-wrap: wrap; }
  .controls select { flex: 1; min-width: 130px; }
  .count-line { font-size: 13px; letter-spacing: 0.01em; color: var(--ink-soft); margin: 10px 0 2px; }

  /* List cards stay close to opaque on purpose: a long scrolling list is read, not admired,
     and stacking blur under many repeated cards would both hurt legibility and cost more
     than it's worth to render. The glass treatment is reserved for the few structural
     surfaces above (panels, detail view), matching material weight to hierarchy. */
  .card {
    background: rgba(255, 255, 255, 0.92);
    border: 1px solid rgba(0, 0, 0, 0.06);
    border-radius: var(--radius-md);
    padding: 14px 16px;
    box-shadow: 0 1px 2px rgba(20,20,30,0.05), 0 1px 1px rgba(20,20,30,0.03);
    margin-bottom: 10px;
    cursor: pointer;
    transition: transform 120ms cubic-bezier(.2,.8,.3,1), background 120ms ease;
  }
  .card:hover { background: #fff; }
  .card:active { transform: scale(0.99); background: #fff; }
  .card-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .card-name { font-weight: 600; font-size: 15px; letter-spacing: -0.005em; }
  .badge { font-size: 12px; font-weight: 600; letter-spacing: 0.01em; padding: 2px 9px; border-radius: var(--radius-sm); white-space: nowrap; }
  .badge-completed { background: #e6f4ea; color: #0a7a2f; }
  .badge-in_progress { background: #fdf0db; color: #a06a00; }
  .card-meta { font-size: 13px; color: var(--ink-soft); margin-top: 3px; }
  .card-sub { font-size: 12px; color: #888; margin-top: 4px; }
  .card-dropoff { font-size: 12px; color: #a06a00; margin-top: 6px; }

  #detail {
    background: var(--glass-bg);
    backdrop-filter: blur(26px) saturate(180%);
    -webkit-backdrop-filter: blur(26px) saturate(180%);
    border-radius: var(--radius-lg);
    padding: 18px 20px;
    border: 1px solid var(--glass-border);
    border-top-color: var(--glass-edge);
    box-shadow: 0 16px 40px -20px rgba(20,20,30,0.24), 0 1px 6px rgba(20,20,30,0.05);
    margin-top: 14px;
  }
  #detail .detail-header { font-size: 14px; color: var(--ink-soft); margin-bottom: 4px; }
  #detail .section-label { font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: #999; margin: 16px 0 6px; border-top: 1px solid rgba(0,0,0,0.06); padding-top: 14px; }
  #detail .section-label:first-of-type { border-top: none; padding-top: 0; margin-top: 10px; }
  #detail .q { font-weight: 600; font-size: 14px; letter-spacing: -0.005em; margin-top: 10px; }
  #detail .a { color: #333; margin-top: 2px; white-space: pre-wrap; font-size: 14px; }
  #detail .a.price { background: rgba(253, 248, 232, 0.9); border-left: 3px solid #d4a800; padding: 6px 10px; border-radius: 6px; }

  .hidden { display: none; }
  .empty { color: var(--ink-soft); padding: 24px; text-align: center; }

  .panel, #detail { animation: materialize 380ms cubic-bezier(0.2, 0.9, 0.3, 1) both; }
  @keyframes materialize {
    from { opacity: 0; transform: translateY(6px) scale(0.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  @media (prefers-reduced-motion: reduce) {
    .panel, #detail { animation: reduced-fade 160ms ease both; }
    @keyframes reduced-fade { from { opacity: 0; } to { opacity: 1; } }
    button, .btn, .card, .chip { transition: opacity 120ms ease; }
    button:active, .btn:active, .card:active, .chip:active { transform: none; }
  }
  @media (prefers-reduced-transparency: reduce) {
    body { background: #f5f4f1; }
    .panel, #detail { background: #fff; backdrop-filter: none; -webkit-backdrop-filter: none; border-color: rgba(0,0,0,0.1); }
    select, input[type="text"], #link-out { background: #fff; }
    .actions a, .actions button, #close-detail { background: #fff; }
    .card { background: #fff; }
  }
  @media (prefers-contrast: more) {
    .panel, #detail, .card { background: #fff; border: 1px solid #000; box-shadow: none; }
    button, .btn { background: #000; }
    .actions a, .actions button, #close-detail { background: #fff; border: 1px solid #000; }
    #delete-response-btn { background: #fff; border: 1px solid #b00020; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <h1>Survey responses</h1>
    <div class="actions">
      <a class="btn" href="/api/admin/export.csv">Export CSV</a>
      <button id="logout-btn">Log out</button>
    </div>
  </div>

  <div id="link-gen" class="panel">
    <h2>Make a tagged link to send someone</h2>
    <div class="row" id="prefix-chips"></div>
    <div class="row" style="margin-top:8px">
      <select id="segment-select"></select>
      <input id="ref-input" type="text" placeholder="Tag, e.g. the WhatsApp number" />
      <button id="generate-link-btn">Generate</button>
    </div>
    <div id="link-out"></div>
  </div>

  <div class="panel">
    <div class="controls">
      <select id="filter-segment"><option value="">All niches</option></select>
      <select id="filter-status">
        <option value="">All statuses</option>
        <option value="completed">Completed</option>
        <option value="in_progress">In progress / dropped off</option>
      </select>
      <select id="filter-contact">
        <option value="">Any contact</option>
        <option value="has">Left contact info</option>
      </select>
      <select id="sort-by">
        <option value="started_desc">Newest first</option>
        <option value="started_asc">Oldest first</option>
        <option value="answers_desc">Most answered first</option>
        <option value="status">By status</option>
      </select>
    </div>
  </div>

  <div class="count-line" id="count-line"></div>
  <div id="list"></div>
  <div id="empty" class="empty hidden">No responses match these filters.</div>
  <div id="detail" class="hidden"></div>
</div>

<script>
  // iOS Safari only runs :active styles when a touch listener exists somewhere in the page.
  document.body.addEventListener("touchstart", function () {}, { passive: true });

  const listEl = document.getElementById("list");
  const emptyEl = document.getElementById("empty");
  const detailEl = document.getElementById("detail");
  const countLineEl = document.getElementById("count-line");
  const filterSegment = document.getElementById("filter-segment");
  const filterStatus = document.getElementById("filter-status");
  const filterContact = document.getElementById("filter-contact");
  const sortBy = document.getElementById("sort-by");

  let allResponses = [];

  // Common country codes for WhatsApp numbers, picked for where outreach actually
  // goes out (Ireland, the US, and the usual EU/UK/UAE spread). Clicking one
  // sets the dialling code at the start of the ref tag so the rest of the number can
  // just be typed or pasted after it.
  const COUNTRY_CODES = [
    { code: "+353", label: "IE +353" },
    { code: "+44", label: "UK +44" },
    { code: "+1", label: "US +1" },
    { code: "+34", label: "ES +34" },
    { code: "+33", label: "FR +33" },
    { code: "+971", label: "UAE +971" },
    { code: "+49", label: "DE +49" },
    { code: "+61", label: "AU +61" },
  ];

  // Longest code first, so stripping an existing prefix can't partly match a shorter
  // one that happens to share its leading digit (e.g. +1 vs +971 both start with "+").
  const CODES_BY_LENGTH_DESC = [...COUNTRY_CODES].sort((a, b) => b.code.length - a.code.length);

  function stripKnownPrefix(value) {
    const trimmed = value.trim();
    const match = CODES_BY_LENGTH_DESC.find((c) => trimmed.startsWith(c.code));
    return match ? trimmed.slice(match.code.length).trim() : trimmed;
  }

  function renderPrefixChips() {
    const el = document.getElementById("prefix-chips");
    el.innerHTML = COUNTRY_CODES.map((c) => '<button type="button" class="chip" data-code="' + c.code + '">' + c.label + "</button>").join("");
    el.querySelectorAll(".chip").forEach((btn) => {
      btn.addEventListener("click", () => {
        const refInput = document.getElementById("ref-input");
        const code = btn.dataset.code;
        const rest = stripKnownPrefix(refInput.value);
        refInput.value = code + (rest ? " " + rest : "");
        el.querySelectorAll(".chip").forEach((b) => b.classList.toggle("active", b === btn));
        refInput.focus();
        refInput.setSelectionRange(refInput.value.length, refInput.value.length);
      });
    });
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  function applyFiltersAndSort() {
    let rows = allResponses.slice();

    if (filterSegment.value) rows = rows.filter((r) => r.segment_slug === filterSegment.value);
    if (filterStatus.value) rows = rows.filter((r) => r.status === filterStatus.value);
    if (filterContact.value === "has") rows = rows.filter((r) => r.contact_phone || r.contact_email);

    const sort = sortBy.value;
    if (sort === "started_asc") rows.sort((a, b) => new Date(a.started_at) - new Date(b.started_at));
    else if (sort === "answers_desc") rows.sort((a, b) => b.answer_count - a.answer_count);
    else if (sort === "status") rows.sort((a, b) => a.status.localeCompare(b.status));
    else rows.sort((a, b) => new Date(b.started_at) - new Date(a.started_at));

    renderList(rows);
  }

  function renderList(rows) {
    countLineEl.textContent = rows.length + " of " + allResponses.length + " response" + (allResponses.length === 1 ? "" : "s");
    if (!rows.length) {
      listEl.innerHTML = "";
      emptyEl.classList.remove("hidden");
      return;
    }
    emptyEl.classList.add("hidden");
    listEl.innerHTML = rows
      .map((r) => {
        const dropOff = r.status === "completed" ? "" : '<div class="card-dropoff">Dropped at Q' + r.current_question_number + ": " + escapeHtml(r.current_question_text) + "</div>";
        const contact = [r.contact_phone, r.contact_email].filter(Boolean).map(escapeHtml).join(" / ");
        const sub = [r.respondent_language ? escapeHtml(r.respondent_language) : "", r.source_ref ? "ref " + escapeHtml(r.source_ref) : "", contact]
          .filter(Boolean)
          .join(" &middot; ");
        return (
          '<div class="card" data-id="' + r.id + '">' +
          '<div class="card-top"><span class="card-name">' + escapeHtml(r.respondent_name || "Unnamed") + '</span>' +
          '<span class="badge badge-' + r.status + '">' + r.status.replace("_", " ") + "</span></div>" +
          '<div class="card-meta">' + escapeHtml(r.segment_slug) + " &middot; " + new Date(r.started_at).toLocaleString() + " &middot; " + r.answer_count + " answered</div>" +
          (sub ? '<div class="card-sub">' + sub + "</div>" : "") +
          dropOff +
          "</div>"
        );
      })
      .join("");
    document.querySelectorAll(".card").forEach((card) => {
      card.addEventListener("click", () => loadDetail(card.dataset.id));
    });
  }

  async function loadResponses() {
    const res = await fetch("/api/admin/responses");
    if (res.status === 401) { window.location.href = "/admin/login"; return; }
    const data = await res.json();
    allResponses = data.responses;
    applyFiltersAndSort();
  }

  async function loadDetail(id) {
    const res = await fetch("/api/admin/responses/" + id);
    if (!res.ok) return;
    const data = await res.json();
    const r = data.response;
    const contact = [r.contact_phone, r.contact_email].filter(Boolean).map(escapeHtml).join(" / ");
    const metaBits = [
      escapeHtml(r.segment_slug),
      new Date(r.started_at).toLocaleString(),
      r.status.replace("_", " "),
      r.respondent_language ? escapeHtml(r.respondent_language) : "",
      r.source_ref ? "ref " + escapeHtml(r.source_ref) : "",
      contact,
    ].filter(Boolean);
    const header =
      '<button id="close-detail">&larr; Back to list</button>' +
      '<button id="delete-response-btn">Delete</button>' +
      "<h2>" + escapeHtml(r.respondent_name || "Unnamed respondent") + "</h2>" +
      '<div class="detail-header">' + metaBits.join(" &middot; ") + "</div>";

    const renderQA = (list) =>
      list
        .map(
          (a) =>
            '<div class="q">Q' + a.number + ": " + escapeHtml(a.text) + '</div><div class="a' + (a.number === 5 ? " price" : "") + '">' + escapeHtml(a.answer) + "</div>"
        )
        .join("");

    const baseline = data.answers.filter((a) => a.kind === "baseline");
    const followups = data.answers.filter((a) => a.kind === "followup");

    const dropOff =
      r.status === "in_progress"
        ? '<div class="section-label">Dropped off here</div><div class="q">Q' + r.current_question_number + ": " + escapeHtml(r.current_question_text) + "</div>"
        : "";

    detailEl.innerHTML =
      header +
      (baseline.length ? '<div class="section-label">Baseline (same for everyone in this niche)</div>' + renderQA(baseline) : "") +
      (followups.length ? '<div class="section-label">Adaptive follow-ups</div>' + renderQA(followups) : "") +
      dropOff;
    detailEl.classList.remove("hidden");
    document.getElementById("close-detail").addEventListener("click", () => {
      detailEl.classList.add("hidden");
      detailEl.innerHTML = "";
    });
    document.getElementById("delete-response-btn").addEventListener("click", async () => {
      if (!window.confirm("Delete this response for good? This cannot be undone.")) return;
      const delRes = await fetch("/api/admin/responses/" + id, { method: "DELETE" });
      if (!delRes.ok) return;
      detailEl.classList.add("hidden");
      detailEl.innerHTML = "";
      await loadResponses();
    });
    detailEl.scrollIntoView({ behavior: "smooth" });
  }

  document.getElementById("logout-btn").addEventListener("click", async () => {
    await fetch("/admin/logout", { method: "POST" });
    window.location.href = "/admin/login";
  });

  async function loadSegments() {
    const res = await fetch("/api/admin/segments");
    if (!res.ok) return;
    const data = await res.json();
    document.getElementById("segment-select").innerHTML = data.segments.map((s) => '<option value="' + s.slug + '">' + escapeHtml(s.niche) + "</option>").join("");
    filterSegment.innerHTML = '<option value="">All niches</option>' + data.segments.map((s) => '<option value="' + s.slug + '">' + escapeHtml(s.niche) + "</option>").join("");
  }

  document.getElementById("generate-link-btn").addEventListener("click", () => {
    const slug = document.getElementById("segment-select").value;
    const ref = document.getElementById("ref-input").value.trim();
    const url = window.location.origin + "/s/" + slug + (ref ? "?ref=" + encodeURIComponent(ref) : "");
    const out = document.getElementById("link-out");
    out.style.display = "block";
    out.textContent = url;
    navigator.clipboard?.writeText(url).catch(() => {});
    out.textContent = url + "  (copied)";
  });

  [filterSegment, filterStatus, filterContact, sortBy].forEach((el) => el.addEventListener("change", applyFiltersAndSort));

  renderPrefixChips();
  loadSegments();
  loadResponses();
</script>
</body>
</html>
