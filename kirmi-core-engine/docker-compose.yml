services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kirmi_migrate
      POSTGRES_PASSWORD: kirmi_local
      POSTGRES_DB: kirmi
    ports: ["5432:5432"]
    volumes: ["kirmi_pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kirmi_migrate -d kirmi"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: ["kirmi_redis:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: .
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    env_file: [.env]
    ports: ["3000:3000"]

  worker:
    build: .
    command: ["node", "dist/queue/workers/index.js"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    env_file: [.env]

volumes:
  kirmi_pg:
  kirmi_redis:
