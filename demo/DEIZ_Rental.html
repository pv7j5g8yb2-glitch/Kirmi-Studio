<!doctype html>
<html lang="en">
<head>

<title>DEIZ Rental</title>
<style>
:root{
  --wa-header:#202c33; --wa-bg:#0b141a; --wa-in:#202c33; --wa-out:#005c4b;
  --wa-text:#e9edef; --wa-dim:#8696a0; --wa-tick:#53bdeb; --wa-panel:#111b21;
  --wa-input:#2a3942; --wa-green:#00a884; --wa-sys:#182229;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:#0a0f13;font-family:var(--font);color:var(--wa-text);overflow:hidden}
#app{
  position:fixed;inset:0;display:flex;flex-direction:column;
  max-width:460px;margin:0 auto;background:var(--wa-bg);
  box-shadow:0 0 60px rgba(0,0,0,.7);
}
@media(min-width:520px){ #app{ border-left:1px solid #000;border-right:1px solid #000 } }

/* header */
.hdr{flex:none;background:var(--wa-header);display:flex;align-items:center;gap:10px;
  padding:10px 8px 10px 6px;padding-top:calc(10px + env(safe-area-inset-top))}
.back{width:26px;height:26px;flex:none;fill:var(--wa-text);opacity:.9}
.av{width:40px;height:40px;border-radius:50%;flex:none;overflow:hidden;background:#000;
  display:flex;align-items:center;justify-content:center}
.who{flex:1;min-width:0;line-height:1.25;cursor:default}
.who b{display:block;font-size:16px;font-weight:500;letter-spacing:.01em}
.who span{display:block;font-size:12.5px;color:var(--wa-dim)}
.who span.typing{color:var(--wa-green)}
.hicon{width:22px;height:22px;flex:none;fill:var(--wa-text);opacity:.85;margin:0 7px;cursor:pointer}
.hicon:hover{opacity:1}
#reset:active{transform:rotate(-180deg)}
#reset{transition:transform .35s ease}

/* chat */
.chat{flex:1;overflow-y:auto;overflow-x:hidden;padding:10px 8px 6px;
  background-color:var(--wa-bg);background-repeat:repeat;background-size:340px}
.row{display:flex;margin:1px 0;padding:0 4px}
.row.out{justify-content:flex-end}
.bub{position:relative;max-width:82%;padding:6px 9px 8px 9px;border-radius:8px;
  font-size:14.6px;line-height:1.42;white-space:pre-wrap;word-wrap:break-word;
  box-shadow:0 1px .5px rgba(11,20,26,.13);animation:pop .18s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(4px) scale(.985)}to{opacity:1;transform:none}}
.row.in .bub{background:var(--wa-in);border-top-left-radius:0}
.row.out .bub{background:var(--wa-out);border-top-right-radius:0}
.row.in.cont .bub{border-top-left-radius:8px}
.row.out.cont .bub{border-top-right-radius:8px}
.bub.rtl{direction:rtl;text-align:right}
.bub.rtl .meta{float:left;margin:6px 8px -4px 0;direction:ltr}
.meta{float:right;margin:6px 0 -4px 8px;font-size:10.5px;color:rgba(233,237,239,.55);
  display:flex;align-items:center;gap:3px;white-space:nowrap}
.tick{width:15px;height:11px;fill:var(--wa-dim)}
.tick.read{fill:var(--wa-tick)}
.tail{position:absolute;top:0;width:8px;height:13px}
.row.in .tail{left:-8px;fill:var(--wa-in)}
.row.out .tail{right:-8px;fill:var(--wa-out)}
.row.cont .tail{display:none}

/* system lines */
.sys{display:flex;justify-content:center;margin:10px 0}
.sys span{background:var(--wa-sys);color:#ffd279;font-size:11.5px;padding:5px 11px;border-radius:7px;
  text-align:center;max-width:88%;line-height:1.5}
.datepill span{background:var(--wa-sys);color:var(--wa-dim);text-transform:uppercase;letter-spacing:.03em;font-size:11.5px}

/* car card */
.card{width:250px;background:rgba(0,0,0,.22);border-radius:6px;overflow:hidden;margin:-2px -3px 4px;
  white-space:normal;font-size:0}
.card .art{height:118px;position:relative;background:linear-gradient(160deg,#2b3a42 0%,#162026 100%);
  display:flex;align-items:center;justify-content:center;font-size:0}
.card .art svg{width:190px;opacity:.92}
.card .yr{position:absolute;top:7px;right:8px;font-size:10px;line-height:1.4;letter-spacing:.08em;color:#c6a268;
  background:rgba(0,0,0,.45);padding:2px 6px;border-radius:3px}
.card .body{padding:8px 10px 10px;font-size:14px}
.card .nm{font-size:14px;font-weight:500;margin-bottom:3px;line-height:1.25}
.card .sp{font-size:11.5px;color:rgba(233,237,239,.62);line-height:1.45}

/* typing bubble */
.dots{display:flex;gap:4px;padding:4px 2px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--wa-dim);animation:bl 1.2s infinite}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes bl{0%,60%,100%{opacity:.35;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}

/* composer */
.comp{flex:none;background:var(--wa-header);padding:7px 8px;
  padding-bottom:calc(7px + env(safe-area-inset-bottom));display:flex;align-items:flex-end;gap:7px}
.pill{flex:1;background:var(--wa-input);border-radius:21px;display:flex;align-items:center;padding:0 10px;min-height:42px}
.pill svg{width:22px;height:22px;fill:var(--wa-dim);flex:none}
.pill svg:first-child{margin-right:8px}
.pill svg:last-child{margin-left:8px}
#msg{flex:1;background:none;border:0;outline:0;color:var(--wa-text);font:inherit;font-size:15.5px;
  padding:11px 0;resize:none;max-height:96px;line-height:1.35}
#msg::placeholder{color:var(--wa-dim)}
.send{width:44px;height:44px;flex:none;border:0;border-radius:50%;background:var(--wa-green);
  display:flex;align-items:center;justify-content:center;cursor:pointer}
.send svg{width:22px;height:22px;fill:#0b141a}
.send:active{transform:scale(.93)}
</style>
</head>

  { id:"long_term",

function matchVehicles(text){
  const t = aliasify(norm(text).toLowerCase()).replace(/[^\p{L}\p{N}\s-]/gu," ").replace(/\s+/g," ");

const TODAY = (() => { const d = new Date(); d.setUTCHours(10,0,0,0); return d; })();
function isFree(v, start, days){
  if(!start) return true;
  const a = Math.round((start - TODAY) / DAY);
  const b = a + (days || 1);
  return !(v.booked || []).some(([s,e]) => a < e && b > s);
}
function freeFrom(v){
  const last = (v.booked || []).reduce((m,[,e]) => Math.max(m,e), 0);
  return new Date(TODAY.getTime() + last * DAY);
}

const BUDGET_AR_RE = /(?:ميزانيتي|ميزانية|الميزانية|حدود|اقل من|أقل من|حوالي)\s*(\d{3,6})|(\d{3,6})\s*(?:درهم)|(\d{3,6})\s*(?:في اليوم|باليوم|يوميا|يومياً)/;
const SEATS_RE = /\b(\d{1,2})\s*(?:people|persons?|pax|passengers?|of us|seats?|اشخاص|أشخاص|افراد|أفراد|ركاب|مقاعد)\b|\b(?:family|group|we are|there are|party)\s*(?:of)?\s*(\d{1,2})\b/i;
const AGE_RE = /\b(?:i\s*am|i'?m|aged?|turning)\s*(\d{2})\b|\b(\d{2})\s*(?:years? old|yo)\b|عمري\s*(\d{2})/i;

function readProfile(text){
  const t = aliasify(norm(text).toLowerCase());
  const p = { cat:null, purposes:[], budget:null, seats:null, age:null };
  for(const [re,c] of CAT_WORDS) if(re.test(t)) p.cat = c;
  for(const [re,g] of PURPOSE_WORDS) if(re.test(t) && !p.purposes.includes(g)) p.purposes.push(g);
  const b = t.match(BUDGET_RE) || t.match(BUDGET_AR_RE);
  if(b){ const n = +(b[1]||b[2]||b[3]||b[4]); if(n >= 300 && n <= 100000) p.budget = n * 100; }
  const s = t.match(SEATS_RE);
  if(s){ const n = +(s[1]||s[2]); if(n >= 1 && n <= 12) p.seats = n; }
  const g = t.match(AGE_RE);
  if(g){ const n = +(g[1]||g[2]||g[3]); if(n >= 16 && n <= 90) p.age = n; }
  return p;
}

/* ---------- pricing ---------- */

function priceIt(v, days){
  const c = [{ tier:"daily", sub: v.d*days }];
  if(v.m && days >= RULES.monthly){ const u = Math.floor(days/RULES.monthly); c.push({ tier:"monthly", sub: v.m*u + v.d*(days-u*RULES.monthly) }); }
  if(v.w && days >= RULES.weekly){ const u = Math.floor(days/RULES.weekly); c.push({ tier:"weekly", sub: v.w*u + v.d*(days-u*RULES.weekly) }); }
  const best = c.reduce((a,b) => b.sub < a.sub ? b : a);
  const vat = Math.round(best.sub * RULES.vat / 100);
  return { days, tier:best.tier, sub:best.sub, vat, total:best.sub+vat, dep:v.dep, km:v.km };
}

/* ---------- topic matching ---------- */

function editDistance1(a, b){
  if(Math.abs(a.length - b.length) > 1) return false;
  // Two letters typed the wrong way round is one mistake, not two: "documnets".
  if(a.length === b.length){
    const diff = [];
    for(let k = 0; k < a.length; k++) if(a[k] !== b[k]) diff.push(k);
    if(diff.length === 2 && diff[1] === diff[0] + 1 &&
       a[diff[0]] === b[diff[1]] && a[diff[1]] === b[diff[0]]) return true;
  }
  let i = 0, j = 0, edits = 0;
  while(i < a.length && j < b.length){
    if(a[i] === b[j]){ i++; j++; continue; }
    if(++edits > 1) return false;
    if(a.length > b.length) i++;
    else if(a.length < b.length) j++;
    else { i++; j++; }
  }
  return edits + (a.length - i) + (b.length - j) <= 1;
}

function topicScore(t, topic, tokens){
  let s = 0;
  for(const entry of topic.kw){
    const i = entry.lastIndexOf(":");
    const word = entry.slice(0, i), w = +entry.slice(i+1) || 1;
    if(/[؀-ۿ]/.test(word)){ if(t.includes(word)) s += w; }
    else {
      const esc = word.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
      // "baby seat" has to match "baby seats", and "break down" has to match "breaks down".
      const flex = esc.replace(/([a-z])(\s)/g, "$1s?$2") + (/s$/.test(word) ? "" : "s?");
      const re = new RegExp("(^|[^a-z0-9])" + flex + "([^a-z0-9]|$)", "i");
      if(re.test(t)) s += w;
      // One typo in a long distinctive word still counts: "insurence", "documnets".
      else if(w >= 3 && word.length >= 6 && !word.includes(" ") && tokens.some(tk => editDistance1(tk, word))) s += w;
    }
  }
  return s;
}
function bestTopic(text){
  const t = norm(text).toLowerCase();
  const tokens = t.replace(/[^a-z0-9\s]/g, " ").split(/\s+/).filter(Boolean);
  let best = null, score = 0;
  for(const topic of TOPICS){
    const s = topicScore(t, topic, tokens);
    if(s > score){ score = s; best = topic; }
  }
  return score >= 3 ? { topic: best, score } : null;
}

/* ---------- presentation ---------- */

const line = (v, ar) => v.make + " " + v.model + ", " + rate(v) + (ar ? " في اليوم. " : "/day. ") + (ar ? v.blurbAr : v.blurb);
const listOf = (vs, ar) => vs.map(v => "• " + line(v, ar)).join("\n");

function recommend(){
  const wants = S.purposes.filter(p => p !== "value");
  const valueFirst = S.purposes.includes("value");
  const inBudget = FLEET.filter(v =>
    (!S.cat || v.cat === S.cat) && (!S.seats || v.seats >= S.seats) &&
    (!S.budget || v.d <= S.budget) && (!S.age || v.minAge <= S.age) && isFree(v, S.start, S.days));
  let list = inBudget, note = null, stretch = null;
  if(wants.length){
    const tagged = inBudget.filter(v => wants.some(w => v.tags.includes(w)));
    if(tagged.length) list = tagged;
    else if(inBudget.length){
      list = inBudget; note = "noneInBracket";
      stretch = FLEET.filter(v => wants.some(w => v.tags.includes(w)) && (!S.seats || v.seats >= S.seats))
        .sort((a,b) => a.d - b.d)[0] || null;
    }
  }
  if(!list.length){
    const relaxed = FLEET.filter(v => (!S.cat || v.cat === S.cat) && (!S.seats || v.seats >= S.seats) && (!S.age || v.minAge <= S.age))
      .filter(v => !wants.length || wants.some(w => v.tags.includes(w)));
    list = relaxed.length ? relaxed : FLEET.slice(); note = "overBudget";
  }
  const score = v => {
    let s = 0;
    for(const w of wants) if(v.tags.includes(w)) s += 3;
    if(S.cat && v.cat === S.cat) s += 2;
    if(S.seats && v.seats >= S.seats) s += 1;
    return s;
  };
  list = list.slice().sort((a,b) => valueFirst ? a.d - b.d : (score(b) - score(a) || a.d - b.d));
  const blank = !S.cat && !S.purposes.length && !S.budget && !S.seats;
  if(blank){ const byPrice = FLEET.slice().sort((a,b) => a.d - b.d); list = [byPrice[0], byPrice[3], byPrice[5], byPrice[7]]; }
  return { list, note, stretch, blank, valueFirst };
}

function leadFor(r, ar){
  const ps = S.purposes.filter(p => PURPOSE_LABEL[p] && p !== "value").map(p => PURPOSE_LABEL[p][ar?1:0]);
  const forWhat = ps.length ? (ar ? " " + ps[0] : " for " + ps[0]) : "";
  const cap = S.budget ? (ar ? " ضمن " + aed(S.budget) + " في اليوم" : " under " + aed(S.budget) + " a day") : "";
  const seats = S.seats ? (ar ? " تتسع لـ " + S.seats : " seating " + S.seats) : "";
  if(r.blank) return ar ? "هذه المجموعة، أربع من ثمانية:" : "Here is the spread, four of the eight:";
  if(r.note === "noneInBracket") return ar ? "لا يوجد شيء" + forWhat + cap + ". ضمن ميزانيتك لدينا:" : "Nothing" + forWhat + cap + ". Inside that budget:";
  if(r.note === "overBudget") return ar ? "لا شيء" + forWhat + cap + seats + ". الأقرب:" : "Nothing" + forWhat + cap + seats + ". Closest we have:";
  if(r.valueFirst && !ps.length) return ar ? "من الأرخص إلى الأعلى:" : "Cheapest first:";
  if(ps.length || S.budget || S.seats) return ar ? "الأنسب" + forWhat + cap + seats + ":" : "Best" + forWhat + cap + seats + ":";
  if(S.cat) return ar ? "لدينا من " + CAT_LABEL[S.cat][1] + cap + ":" : "Our " + CAT_LABEL[S.cat][0] + cap + ":";
  return ar ? "هذه الخيارات:" : "Here is what I would put in front of you:";
}

const ASK_EN = "What is it for, family, a desert trip, a wedding, business, or just something good to drive? And roughly what a day?";
const ASK_AR = "ما الغرض منها، عائلة أم رحلة صحراوية أم عرس أم عمل أم سيارة ممتعة للقيادة؟ وكم ميزانيتك تقريباً في اليوم؟";

/* ---------- the engine ---------- */

function engineReply(text){
  const ar = isAr(text);
  const L = (en, a) => ar ? a : en;
  const raw = String(text || "");
  const t = norm(raw).toLowerCase();
  const out = (msgs, escalated) => ({ messages: [].concat(msgs), escalated: !!escalated });
  if(!t.trim()) return out({ text: L("That came through empty, what are you after?", "لم تصلني رسالة، ما الذي تبحث عنه؟") });

  /* The four things that go to a person on purpose. Nothing else does. */
  if(RX.complaint.test(t))
    return out({ text: L("That should not have happened and it is not mine to answer. I am putting you to one of the team now with this whole conversation attached, so you will not have to repeat yourself.",
                         "لا يجب أن يحدث هذا وليس من المفترض أن أرد عليه بنفسي. سأحوّلك إلى أحد الزملاء الآن مع هذه المحادثة كاملة، فلن تضطر لإعادة الشرح.") }, true);
  if(RX.legal.test(t))
    return out({ text: L("Anything involving a claim or a legal matter goes to the manager directly, not to me. Passing you over now.",
                         "أي أمر يتعلق بمطالبة أو مسألة قانونية يُحوّل إلى المدير مباشرة وليس إليّ. أحوّلك الآن.") }, true);
  if(RX.custom.test(t))
    return out({ text: L("A company rate is set by the team, not by me. I am passing you over now. If you tell me roughly how many cars and for how long, I will send that across so they open with a number rather than questions.",
                         "أسعار الشركات يحددها الفريق وليس أنا. أحوّلك الآن. وإذا أخبرتني تقريباً بعدد السيارات والمدة فسأرسل ذلك معك ليبدأوا معك برقم بدلاً من الأسئلة.") }, true);
  if(RX.human.test(t) || RX.manager.test(t))
    return out({ text: L("Of course. Passing you to one of the team now, they pick up on this same chat.",
                         "بالتأكيد. أحوّلك إلى أحد الزملاء الآن، وسيكمل معك على نفس المحادثة.") }, true);

  /* Read the message */
  const found = extractDates(raw);
  const prof = readProfile(raw);
  const named = matchVehicles(raw);
  if(found.start) S.start = found.start;
  if(found.days)  S.days  = found.days;
  if(prof.cat)    S.cat   = prof.cat;
  if(prof.budget) S.budget = prof.budget;
  if(prof.seats)  S.seats = prof.seats;
  if(prof.age)    S.age   = prof.age;
  for(const g of prof.purposes) if(!S.purposes.includes(g)) S.purposes.push(g);
  if(S.seats && S.seats >= 6 && !S.purposes.includes("family")) S.purposes.push("family");

  if(RX.switchTo.test(t) && named.length){ S.v = named[0]; S.quoted = null; S.shortlist = []; }
  else if(RX.reject.test(t)){
    const outv = named.slice(); if(S.v) outv.push(S.v);
    S.v = null; S.quoted = null;
    const alts = recommend().list.filter(v => !outv.some(o => o.id === v.id)).slice(0,3);
    S.shortlist = alts;
    return out({ text: L("My mistake. Then here are the ones worth looking at:\n" + listOf(alts,false) + "\nWhich of those, or tell me what it is for and your budget a day?",
                         "خطأ مني. إليك الخيارات التي تستحق النظر:\n" + listOf(alts,true) + "\nأيها تفضل، أو قل لي الغرض وميزانيتك في اليوم؟") });
  }

  if(RX.frustrated.test(t)){
    S.v = null; S.quoted = null;
    return out({ text: L("Sorry, I got ahead of you. Simplest way through: tell me what the car is for and roughly the budget a day, and I will send you two that fit and nothing else.",
                         "آسف، استعجلت عليك. أبسط طريقة: قل لي ما الغرض من السيارة وكم الميزانية تقريباً في اليوم، وسأرسل لك خيارين يناسبانك فقط.") });
  }

  if(RX.identity.test(t))
    return out({ text: L("I am the DEIZ assistant. I can see the fleet, the rates and what is actually free, so I can price a car and hold it for you right now. Anything I should not decide alone goes to a person straight away.",
                         "أنا مساعد ديز. أرى الأسطول والأسعار والمتاح فعلياً، ويمكنني تسعير السيارة وحجزها لك الآن. وأي أمر لا يجب أن أقرره وحدي أحوّله إلى موظف فوراً.") });

  if(named.length === 1) { S.v = named[0]; S.shortlist = []; }

  /* Knowledge base. A named car plus a duration is a price request, not a policy question. */
  const wantsQuote = S.v && S.days;
  const hit = bestTopic(raw);
  if(hit && !wantsQuote){
    S.misses = 0;
    if(hit.topic.id === "objection"){
      const cheap = FLEET.slice().sort((a,b) => a.d - b.d).slice(0,3);
      S.shortlist = cheap;
      return out({ text: L(hit.topic.en, hit.topic.ar) + "\n" +
        L("The cheapest end of the fleet, for reference:", "وللمقارنة، أرخص ما في الأسطول:") + "\n" + listOf(cheap, ar) });
    }
    if(hit.topic.id === "photos"){
      const v = S.v || S.shortlist[0];
      if(!v) return out({ text: L("Which car, and I will send photos and a walkaround video of it.", "أي سيارة؟ وسأرسل لك صوراً وفيديو دوران حولها.") });
      return out([{ text: L(hit.topic.en, hit.topic.ar) }, { card: v }]);
    }
    return out({ text: L(hit.topic.en, hit.topic.ar) });
  }

  /* A yes against a live quote becomes a hold */
  if(RX.confirm.test(t) && S.quoted){
    const q = S.quoted, ref = Math.random().toString(16).slice(2,8).toUpperCase();
    S.quoted = null; S.held = q;
    return out([
      { text: L("Done. The " + q.label + " is held for you, reference " + ref + ".",
                "تم. " + q.label + " محجوزة لك، رقم الحجز " + ref + ".") },
      { text: L("Send me a photo of your passport and driving licence and one of the team checks them, usually within the hour. Where and what time do you want it delivered?",
                "أرسل لي صورة من جواز السفر ورخصة القيادة ويراجعها أحد الزملاء، عادة خلال ساعة. وأين ومتى تريد التسليم؟") }
    ]);
  }

  if(RX.second.test(t) && !S.v)
    return out({ text: L("Two cars is no problem, they go on one booking and one deposit. Tell me which two and the dates and I will price them together.",
                         "سيارتان ليست مشكلة، تُدرجان في حجز واحد وتأمين واحد. أخبرني بالسيارتين والتواريخ وسأسعّرهما معاً.") });

  /* Straight after a hold, the next message is the answer to "where and when". */
  if(S.held && !named.length && !found.days && !found.start &&
     !RX.confirm.test(t) && !RX.greet.test(t) && !RX.thanks.test(t) && raw.trim().length > 2){
    const where = raw.trim();
    S.held = null;
    return out({ text: L("Noted, " + where + ". You will get a confirmation here once the documents are approved, and the driver's number an hour before he sets off.",
                         "تم التسجيل، " + where + ". وسيصلك التأكيد هنا فور اعتماد الأوراق، ورقم السائق قبل ساعة من انطلاقه.") });
  }

  /* Comparing */
  if(named.length >= 2 || (named.length === 1 && RX.compare.test(t) && S.shortlist.length)){
    const a = named[0], b = named[1] || S.shortlist.find(x => x.id !== a.id) || FLEET[0];
    S.v = null; S.shortlist = [a,b];
    const row = v => v.make + " " + v.model + ": " + rate(v) + L("/day"," في اليوم") + ", " + v.power + L(" bhp"," حصان") + ", " +
      v.seats + L(" seats"," مقاعد") + ", " + L("deposit ","تأمين ") + aed(v.dep) + ". " + L(v.blurb, v.blurbAr);
    const cheaper = a.d <= b.d ? a : b;
    return out({ text: L(row(a) + "\n" + row(b) + "\nOn money alone the " + cheaper.make + " " + cheaper.model + " is the easier call. What are you using it for?",
                         row(a) + "\n" + row(b) + "\nمن ناحية السعر فقط، " + cheaper.make + " " + cheaper.model + " هي الأسهل. ما الغرض من استخدامها؟") });
  }

  // "how much" is a browse on its own, but "how much for 4 days from tomorrow"
  // against a shortlist is a price request, so dates outrank browsing.
  const askedForHelp = (RX.unsure.test(t) || RX.browse.test(t) || RX.wantCar.test(t))
    && !named.length && !(found.days || found.start);

  /* Recommend */
  if(!S.v && (askedForHelp || prof.cat || prof.purposes.length || prof.budget || prof.seats)){
    S.misses = 0;
    const r = recommend();
    const top = r.list.slice(0, r.blank ? 4 : 3);
    S.shortlist = top;
    const knowsNeed = S.purposes.length || S.budget || S.seats;
    let tail = knowsNeed
      ? L("Want me to price one? Give me the dates and how many days.", "تحب أسعّر لك واحدة؟ أعطني التواريخ وعدد الأيام.")
      : L(ASK_EN, ASK_AR);
    if(r.stretch) tail = L("If you can stretch to " + rate(r.stretch) + " a day, the " + r.stretch.make + " " + r.stretch.model + " is the one you actually want. ",
                           "وإذا أمكنك الوصول إلى " + rate(r.stretch) + " في اليوم فإن " + r.stretch.make + " " + r.stretch.model + " هي ما تبحث عنه فعلاً. ") + tail;
    return out({ text: leadFor(r, ar) + "\n" + listOf(top, ar) + "\n" + tail });
  }

  /* A car we do not stock */
  const other = !named.length && !S.v ? unknownCar(raw) : null;
  if(other){
    S.misses = 0;
    const alts = recommend().list.slice(0,3);
    S.shortlist = alts;
    return out({ text: L("We do not keep the " + other + ". Closest in the fleet:\n" + listOf(alts,false) + "\nWould one of those do?",
                         "لا نملك " + other + ". الأقرب لها في الأسطول:\n" + listOf(alts,true) + "\nهل تناسبك إحداها؟") });
  }

  /* Dates against a shortlist, or a bare yes, picks the top of the list */
  if(!S.v && S.shortlist.length && (S.days || S.start || RX.confirm.test(t))) S.v = S.shortlist[0];

  /* The car we have */
  if(S.v){
    S.misses = 0;
    const v = S.v, label = v.make + " " + v.model;

    if(S.age && S.age < v.minAge){
      const ok = FLEET.filter(x => x.minAge <= S.age).sort((a,b) => b.d - a.d).slice(0,3);
      S.v = null; S.shortlist = ok;
      return out({ text: L("Not at " + S.age + ", I am afraid. The " + label + " needs a driver of " + v.minAge + " or over, and that is the insurer's line rather than ours. At " + S.age + " you can take:\n" + listOf(ok,false) + "\nWould one of those work?",
                           "للأسف ليس في سن " + S.age + ". " + label + " تتطلب سائقاً بعمر " + v.minAge + " فأكثر، وهذا شرط شركة التأمين وليس شرطنا. وفي عمر " + S.age + " يمكنك أخذ:\n" + listOf(ok,true) + "\nهل تناسبك إحداها؟") });
    }

    if(S.start && !isFree(v, S.start, S.days || 1)){
      const back = freeFrom(v);
      const alts = FLEET.filter(x => x.id !== v.id && x.cat === v.cat && isFree(x, S.start, S.days || 1)).slice(0,2);
      const altText = alts.length
        ? L(" Free on those dates: " + alts.map(x => x.make + " " + x.model + " at " + rate(x) + "/day").join(", ") + ". Shall I price one?",
            " والمتاح في تلك التواريخ: " + alts.map(x => x.make + " " + x.model + " بـ " + rate(x) + " في اليوم").join("، ") + ". هل أسعّر لك إحداها؟")
        : L(" Shall I put you down for when it is back?", " هل أسجلك عند توفرها؟");
      S.quoted = null;
      return out({ text: L("The " + label + " is out on those dates, back on " + fmtDate(back) + "." + altText,
                           label + " محجوزة في تلك التواريخ وتعود في " + fmtDate(back) + "." + altText) });
    }

    if(RX.available.test(t) && !S.days)
      return out({ text: L("The " + label + " is free" + (S.start ? " on " + fmtDate(S.start) : " right now") + ". How many days do you need it?",
                           label + " متاحة" + (S.start ? " في " + fmtDate(S.start) : " حالياً") + ". كم عدد الأيام التي تحتاجها؟") });

    if(!S.days){
      const when = S.start ? L(" I have you down for " + fmtDate(S.start) + ".", " سجّلت التاريخ " + fmtDate(S.start) + ".") : "";
      return out([
        { text: L("The " + label + " is with us. " + v.blurb + " " + rate(v) + " a day, " + v.power + " bhp, " + v.seats + " seats." + when + " How many days do you need it?",
                  label + " متوفرة لدينا. " + v.blurbAr + " " + rate(v) + " في اليوم، " + v.power + " حصان، " + v.seats + " مقاعد." + when + " كم عدد الأيام؟") },
        { card: v }
      ]);
    }

    if(S.days < v.minDays)
      return out({ text: L("The " + label + " goes out for " + v.minDays + " days minimum. Shall I price " + v.minDays + " days?",
                           label + " حدها الأدنى " + v.minDays + " أيام. هل أسعّر لك " + v.minDays + " أيام؟") });

    const p = priceIt(v, S.days);
    S.quoted = { label, days: p.days, total: p.total };
    const alt = S.shortlist.find(x => x.id !== v.id);
    const tier = p.tier === "daily" ? "" :
      L(" That is the " + p.tier + " rate, cheaper than counting the days.",
        " وهذا هو السعر " + (p.tier === "weekly" ? "الأسبوعي" : "الشهري") + " وهو أرخص من الحساب اليومي.");
    const other2 = alt ? L(" If you would rather the " + alt.make + " " + alt.model + ", that is " + rate(alt) + " a day.",
                           " وإن كنت تفضل " + alt.make + " " + alt.model + " فسعرها " + rate(alt) + " في اليوم.") : "";
    return out({ text: L(label + " for " + p.days + " day" + (p.days===1?"":"s") + ": " + aed(p.total) + " including VAT." + tier +
                         " Deposit " + aed(p.dep) + ", held and returned. " + p.km + " km a day, delivery free anywhere in Dubai. Shall I hold it?" + other2,
                         label + " لمدة " + p.days + " " + (p.days===1?"يوم":"أيام") + ": " + aed(p.total) + " شامل الضريبة." + tier +
                         " التأمين " + aed(p.dep) + " يُحجز ويُعاد. و " + p.km + " كم يومياً، والتوصيل مجاني في أي مكان في دبي. هل أحجزها لك؟" + other2) });
  }

  /* Dates but no car */
  if(S.days || S.start){
    S.misses = 0;
    const top = recommend().list.filter(v => isFree(v, S.start, S.days || 1)).slice(0,4);
    S.shortlist = top;
    return out({ text: L("Free" + (S.start ? " on " + fmtDate(S.start) : " for those dates") + ":\n" + listOf(top,false) + "\nWhich one, or tell me what it is for and I will pick for you.",
                         "المتاح" + (S.start ? " في " + fmtDate(S.start) : " في تلك التواريخ") + ":\n" + listOf(top,true) + "\nأيها تفضل، أو قل لي الغرض وسأختار لك.") });
  }

  if(RX.greet.test(t)){
    if(S.greeted) return out({ text: L("Still here. What do you need the car for?", "ما زلت معك. ما الغرض من السيارة؟") });
    S.greeted = true;
    return out({ text: L("Hello, thanks for messaging DEIZ Rental. We run SUVs, sports cars, a Bentley and an S500, from AED 650 a day up to AED 3,200, delivered anywhere in Dubai. " + ASK_EN,
                         "أهلاً بك، شكراً لتواصلك مع ديز. لدينا سيارات دفع رباعي ورياضية وبنتلي و S500، من 650 درهم في اليوم حتى 3,200 درهم، مع التوصيل في أي مكان في دبي. " + ASK_AR) });
  }

  if(RX.thanks.test(t))
    return out({ text: L("Any time. Message here whenever, day or night, it gets answered.",
                         "في أي وقت. راسلنا هنا متى احتجت، ليلاً أو نهاراً، وسيصلك الرد.") });

  /* Last resort. Ask, never guess, and never escalate for not understanding. */
  S.misses++;
  const sample = recommend().list.slice(0,3);
  S.shortlist = sample;
  if(S.misses === 1)
    return out({ text: L("Say that another way for me? If it helps: tell me the car, the dates, or what you are using it for, and I will take it from there.",
                         "ممكن تعيد صياغتها؟ وإن ساعدك: أخبرني بالسيارة أو التواريخ أو الغرض من الاستخدام وسأكمل من هناك.") });
  return out({ text: L("Still not with you, so let me put something in front of you instead:\n" + listOf(sample,false) + "\nOr ask me about the deposit, insurance, delivery, documents, Salik, mileage or anything else, I have all of it.",
                       "ما زلت لم أفهم، فدعني أعرض عليك شيئاً بدلاً من ذلك:\n" + listOf(sample,true) + "\nأو اسألني عن التأمين أو التوصيل أو الأوراق أو سالك أو المسافة أو أي شيء آخر، كل ذلك متوفر لدي.") });
}


/* ---------- chrome ---------- */
const $ = s => document.querySelector(s);
const chat = $("#chat"), sub = $("#sub");
const sleep = ms => new Promise(r => setTimeout(r, ms));

/* WhatsApp doodle backdrop */
chat.style.backgroundImage = "url(\"data:image/svg+xml;utf8," + encodeURIComponent(
  `<svg xmlns='http://www.w3.org/2000/svg' width='340' height='340' viewBox='0 0 340 340'>

   <path d='M36 300h22v14H36z' transform='rotate(-8 47 307)'/><circle cx='96' cy='306' r='9'/>
   <path d='M140 298l9 16h-18z'/><path d='M186 296c8 0 14 6 14 14'/><path d='M232 298h18v18h-18z' transform='rotate(20 241 307)'/>
   <path d='M282 300l7 7-7 7-7-7z'/></g></svg>`) + "\")";

/* DEIZ avatar */
$("#av").innerHTML =
  `<svg viewBox='0 0 40 40' width='40' height='40'>
     <defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'>
       <stop offset='0' stop-color='#1a1a1a'/><stop offset='1' stop-color='#000'/></linearGradient></defs>
     <circle cx='20' cy='20' r='20' fill='url(#g)'/>
     <circle cx='20' cy='20' r='18.2' fill='none' stroke='#c6a268' stroke-width='1.1'/>
     <text x='20' y='25.4' text-anchor='middle' font-family='Helvetica,Arial,sans-serif'
       font-size='15.5' font-weight='700' letter-spacing='.5' fill='#c6a268'>D</text>
   </svg>`;

const TICK = `<svg class="tick read" viewBox="0 0 18 12"><path d="M17.4 1.3a.5.5 0 0 0-.7 0L9.3 8.7 8 7.4a.5.5 0 1 0-.7.7l1.7 1.7c.2.2.5.2.7 0l7.7-7.8a.5.5 0 0 0 0-.7zM11.9 1.3a.5.5 0 0 0-.7 0L3.8 8.7 1.4 6.3a.5.5 0 1 0-.7.7l2.8 2.8c.2.2.5.2.7 0l7.7-7.8a.5.5 0 0 0 0-.7z"/></svg>`;
const TAIL_IN  = `<svg class="tail" viewBox="0 0 8 13"><path d="M8 0H0v13C0 6 3 1.5 8 0z"/></svg>`;
const TAIL_OUT = `<svg class="tail" viewBox="0 0 8 13"><path d="M0 0h8v13C8 6 5 1.5 0 0z"/></svg>`;

const clock = () => new Date().toLocaleTimeString("en-GB", { hour:"2-digit", minute:"2-digit" });
let lastSide = null;

function carArt(v){
  const gold = "#c6a268";
  const shape = v.cat === "sports"
    ? "M8 44c2-9 9-13 14-14l14-11c4-3 9-4 14-4h18c7 0 13 3 18 8l14 11c6 1 12 4 14 10 1 4 1 7 0 10H8c-1-3-1-7 0-10z"
    : v.cat === "sedan"
    ? "M8 46c1-10 8-14 14-15l13-13c3-3 7-5 12-5h22c5 0 9 2 12 5l13 13c6 1 13 5 14 15 0 4 0 8-1 11H9c-1-3-1-7-1-11z"
    : "M10 44c0-12 6-17 13-18l9-15c2-4 6-6 11-6h26c5 0 9 2 11 6l9 15c7 1 13 6 13 18v11H10V44z";
  return `<svg viewBox="0 0 120 72">
    <path d="${shape}" fill="none" stroke="${gold}" stroke-width="1.7" stroke-linejoin="round"/>
    <path d="M30 30h60" stroke="${gold}" stroke-opacity=".45" stroke-width="1.2"/>
    <circle cx="32" cy="55" r="9" fill="none" stroke="${gold}" stroke-width="1.7"/>
    <circle cx="88" cy="55" r="9" fill="none" stroke="${gold}" stroke-width="1.7"/>
    <circle cx="32" cy="55" r="3.4" fill="${gold}" fill-opacity=".5"/>
    <circle cx="88" cy="55" r="3.4" fill="${gold}" fill-opacity=".5"/>
  </svg>`;
}

function bubble(side, opts){
  const cont = lastSide === side;
  lastSide = side;
  const row = document.createElement("div");
  row.className = "row " + side + (cont ? " cont" : "");
  const b = document.createElement("div");
  b.className = "bub";
  b.innerHTML = side === "in" ? TAIL_IN : TAIL_OUT;

  if(opts.card){
    const v = opts.card;
    const c = document.createElement("div");
    c.className = "card";
    c.innerHTML = `<div class="art"><span class="yr">${v.year}</span>${carArt(v)}</div>
      <div class="body"><div class="nm">${v.make} ${v.model}</div>
      <div class="sp">${v.engine}, ${v.power} bhp<br>${v.seats} seats, ${v.bags} bags, ${v.drive}</div></div>`;
    b.appendChild(c);
  }
  if(opts.text){
    const span = document.createElement("span");
    span.textContent = opts.text;
    // Arabic reads right to left, and the timestamp has to follow it.
    if(/[؀-ۿ]/.test(opts.text)){ span.dir = "rtl"; b.classList.add("rtl"); }
    b.appendChild(span);
  }
  const m = document.createElement("div");
  m.className = "meta";
  m.innerHTML = clock() + (side === "out" ? TICK : "");
  b.appendChild(m);
  row.appendChild(b);
  chat.appendChild(row);
  chat.scrollTop = chat.scrollHeight;
  return row;
}

function sysLine(text, cls){
  const d = document.createElement("div");
  d.className = "sys " + (cls || "");
  const s = document.createElement("span");
  s.textContent = text;
  d.appendChild(s);
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
  lastSide = null;
}

function typing(on){
  sub.textContent = on ? "typing…" : "online";
  sub.className = on ? "typing" : "";
}

/* ---------- conversation ---------- */

let generation = 0;

function openChat(){
  generation++;
  chat.innerHTML = "";
  lastSide = null;
  typing(false);
  resetSlots();
  sysLine("TODAY", "datepill");
  sysLine("Messages are end-to-end encrypted. No one outside of this chat can read them.");
}

async function send(){
  const box = $("#msg");
  const text = box.value.trim();
  if(!text) return;
  const mine = generation;
  box.value = "";
  box.dir = "ltr";
  box.style.height = "auto";
  bubble("out", { text });

  await sleep(320);
  if(mine !== generation) return;
  typing(true);
  let res;
  try { res = engineReply(text); }
  catch(e){ res = { messages:[{ text:"One moment, passing you to the team." }], escalated:true }; }

  for(let i = 0; i < res.messages.length; i++){
    const m = res.messages[i];
    const len = (m.text || "").length;
    await sleep(Math.min(1500, 420 + len * 7));
    if(mine !== generation) return;
    if(i === 0) typing(false);
    bubble("in", m);
    if(i < res.messages.length - 1){ await sleep(220); typing(true); }
  }
  if(mine !== generation) return;
  typing(false);
  if(res.escalated) sysLine("Rashid from DEIZ has joined the chat");
}

$("#send").addEventListener("click", send);
$("#msg").addEventListener("keydown", e => {
  if(e.key === "Enter" && !e.shiftKey){ e.preventDefault(); send(); }
});
$("#msg").addEventListener("input", e => {
  e.target.dir = /[؀-ۿ]/.test(e.target.value) ? "rtl" : "ltr";
  e.target.style.height = "auto";
  e.target.style.height = Math.min(96, e.target.scrollHeight) + "px";
});
$("#reset").addEventListener("click", openChat);

openChat();
$("#msg").focus();
</script>
