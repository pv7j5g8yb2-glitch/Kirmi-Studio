services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kirmi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kirmi}
      POSTGRES_DB: kirmi
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kirmi"]
      interval: 5s
      retries: 10
    ports: ["5432:5432"]

  app:
    build: .
    depends_on:
      db: { condition: service_healthy }
    environment:
      NODE_ENV: production
      PORT: 3000
      # migrations run as the owner; the app then connects as kirmi_app
      DATABASE_URL: postgresql://kirmi_app:${APP_DB_PASSWORD:-kirmi_app}@db:5432/kirmi
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
      INSTAGRAM_APP_SECRET: ${INSTAGRAM_APP_SECRET:-}
      INSTAGRAM_ACCESS_TOKEN: ${INSTAGRAM_ACCESS_TOKEN:-}
      INSTAGRAM_ACCOUNT_ID: ${INSTAGRAM_ACCOUNT_ID:-}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-none}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    ports: ["3000:3000"]
    restart: unless-stopped

volumes:
  pgdata:
